name: Test
on:
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:
  schedule:
    - cron: 24 4 * * 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan validation
        id: plan
        run: node .github/ci/ci.mjs plan test
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
      # The engine tests drive a stand-in extension in headless Chromium, through the `chromium`
      # channel: the full browser, not the headless shell that ships by default.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @walletwright/core exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - run: pnpm --filter @walletwright/core exec playwright install --with-deps chromium
      # The real-wallet E2E needs a headed browser (see apps/demo) and runs in e2e.yml, not here.
      - run: node .github/ci/ci.mjs run test -- pnpm turbo run test --filter=@walletwright/core
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload CI evidence
        if: ${{ !cancelled() }}
        with:
          name: ci-execution-${{ github.workflow }}-${{ github.job }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
