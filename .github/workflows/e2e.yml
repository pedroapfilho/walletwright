name: E2E
on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wallets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
      - run: pnpm build --filter="./packages/*"
      # The extensions are the slow part of a cold run; the onboarded profiles are rebuilt each time.
      - uses: actions/cache@v4
        with:
          path: apps/demo/.walletwright
          key: walletwright-${{ runner.os }}-${{ hashFiles('apps/demo/wallet-setup.ts') }}
      # `channel: "chromium"` needs the full browser, not the headless shell that ships by default.
      - run: pnpm --filter demo exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: foundry-rs/foundry-toolchain@v1
      - run: anvil --chain-id 31337 &
      # Onboard under the virtual display too, not headless. MetaMask has documented compatibility
      # problems running headless on GitHub Actions, and a profile onboarded that way stays broken:
      # a run from a headless-built cache reached MetaMask's home screen at `notification.html`
      # instead of the pending request, even when the specs themselves ran headed.
      - run: |
          for wallet in metamask phantom rabby solflare slush; do
            xvfb-run --auto-servernum pnpm --filter demo exec tsx scripts/cache-one.ts "$wallet"
          done
      # Headed under a virtual display, which covers all five wallets in one gate. Headless works on
      # a developer machine (and Phantom and Rabby pass headless here), but MetaMask's approvals do
      # not materialise on this hardware, which is a MetaMask issue rather than a walletwright one.
      #
      # "add, rename, and switch accounts" is excluded for an unrelated reason: MetaMask restores
      # account names for this SRP from its own backup-and-sync (the run below talks to
      # user-storage.api.cx.metamask.io), and the public test seed is shared, so the wallet reports
      # names like "dev1" and "personal" in place of the ones walletwright set.
      - run: |
          xvfb-run --auto-servernum pnpm --filter demo exec playwright test --headed \
            --grep-invert "add, rename, and switch accounts"
      # Playwright writes a page snapshot per failure. Without it a red run here can only be read
      # through the log, which says what timed out but not what the wallet was showing at the time.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: apps/demo/test-results
          retention-days: 7
