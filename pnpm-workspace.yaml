packages:
  - apps/*
  - packages/*

peerDependencyRules:
  allowedVersions:
    "@typescript-eslint/parser>typescript": "7"
    "@typescript-eslint/project-service>typescript": "7"
    "@typescript-eslint/tsconfig-utils>typescript": "7"
    "@typescript-eslint/typescript-estree>typescript": "7"
    "@typescript-eslint/utils>typescript": "7"

overrides:
  # Force prool's transitive tar to a patched release (dev-only, local-anvil tests) to clear HIGH advisories.
  tar: "^7.5.20"
  # Security: force patched transitive releases to clear pnpm audit advisories.
  # Each pin is the lowest release that carries the fix.
  axios: "^1.18.0"
  baseline-browser-mapping: "^2.11.0"
  brace-expansion: "^5.0.9"
  decode-uri-component: "^0.5.0"
  hono: "^4.13.5"
  sharp: "^0.35.4"
  uuid: "^11.1.1"
  ws: "^8.21.0"

allowBuilds:
  # Prebuilt binaries ship via optionalDependencies; the build script is only
  # a node-gyp fallback and the watcher is only used by `tailwindcss --watch`.
  "@parcel/watcher": false
  "@reown/appkit": false
  bufferutil: false
  classic-level: true
  esbuild: true
  keccak: false
  sharp: true
  utf-8-validate: false

minimumReleaseAgeExclude:
  - "@dashfoo/*"
  - "@easeia/*"
  - "@usebutr/*"
  - "@walletwright/*"
  - astro-awesomeness
  - oxlint-config-awesomeness
